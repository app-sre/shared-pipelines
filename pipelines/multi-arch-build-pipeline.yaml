# Single arch build (amd64)
# Note, that we keep the multi-arch filename because we dont want to change refs in all repos
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: single-arch-build-pipeline
spec:
  finally:
  - name: show-sbom
    params:
    - name: IMAGE_URL
      value: $(tasks.build-image-index.results.IMAGE_URL)
    taskRef:
      params:
      - name: name
        value: show-sbom
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-show-sbom:0.2@sha256:5fe387642611a8193395adb083df203534c30fef88a032ba0c074b8280c4b135
      - name: kind
        value: task
      resolver: bundles
  - name: show-summary
    params:
    - name: pipelinerun-name
      value: $(context.pipelineRun.name)
    - name: git-url
      value: $(tasks.clone-repository.results.url)?rev=$(tasks.clone-repository.results.commit)
    - name: image-url
      value: $(params.output-image)
    - name: build-task-status
      value: $(tasks.build-image-index.status)
    taskRef:
      params:
      - name: name
        value: summary
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-summary:0.3@sha256:8012a7eb3ef9d8810051798ef10653bae9e0f854bfd65a7feddf141645c844ac
      - name: kind
        value: task
      resolver: bundles
    workspaces:
    - name: workspace
      workspace: workspace
  workspaces:
  - name: workspace
  - name: git-auth
    optional: true
  - name: netrc
    optional: true
  params:
  - default: ""
    description: Specify which stage to build in a multi-stage Dockerfile.
    name: target-stage
    type: string
  # https://github.com/konflux-ci/build-definitions/tree/main/task/buildah/0.5
  - default: true
    description: Whether to skip stages in Containerfile that seem unused by subsequent stages
    name: skip-unused-stages
    type: string
  - description: Source Repository URL
    name: git-url
    type: string
  - default: ""
    description: Revision of the Source Repository
    name: revision
    type: string
  - description: Fully Qualified Output Image
    name: output-image
    type: string
  - default: .
    description: Path to the source code of an application's component from where to build image.
    name: path-context
    type: string
  - default: Dockerfile
    description: Path to the Dockerfile inside the context specified by parameter path-context
    name: dockerfile
    type: string
  - default: "false"
    description: Force rebuild image
    name: rebuild
    type: string
  - default: "false"
    description: Skip checks against built image
    name: skip-checks
    type: string
  - default: "false"
    description: Execute the build with network isolation
    name: hermetic
    type: string
  - default: ""
    description: Build dependencies to be prefetched by Cachi2
    name: prefetch-input
    type: string
  - default: ""
    description: Image tag expiration time, time values could be something like 1h, 2d, 3w for hours, days, and weeks, respectively.
    name: image-expires-after
  - default: "false"
    description: Build a source image.
    name: build-source-image
    type: string
  - default: "false"
    description: Add built image into an OCI image index
    name: build-image-index
    type: string
  - default: []
    description: Array of --build-arg values ("arg=value" strings) for buildah
    name: build-args
    type: array
  - default: ""
    description: Path to a file with build arguments for buildah, see https://www.mankier.com/1/buildah-build#--build-arg-file
    name: build-args-file
    type: string
  - default: "does-not-exist"
    description: Name of a secret which will be made available to the build with 'buildah build --secret' at /run/secrets/$ADDITIONAL_SECRET
    name: additional_secret
    type: string
  - default: "false"
      # https://github.com/konflux-ci/build-definitions/tree/main/task/git-clone/0.1
    description: Fetch all tags for the repo.
    name: fetchTags
    type: string
  - default: "1"
      # https://github.com/konflux-ci/build-definitions/tree/main/task/git-clone/0.1
    description: Perform a shallow clone, fetching only the most recent N commits.
    name: cloneDepth
    type: string
  - default: ""
    description: Script to run in ephemeral namespace. If empty, ephemeral namespace tasks are skipped.
    name: ephemeral-namespace-run-script
    type: string
    # https://catalog.redhat.com/software/containers/openshift4/ose-cli/5cd9ba3f5a13467289f4d51d/history?architecture=amd64
  - default: "v4.15"
    description: Tag of the OpenShift CLI from registry.redhat.io/openshift4/ose-cli to use for ephemeral namespace tasks.
    name: ephemeral-namespace-oc-cli-version
    type: string
  - default: ""
    description: Path to a file with goss tests for container structure test.
    name: goss-container-structure-test-file
    type: string
  - default: "60s"
    description: Timeout for pod under-test to be ready in ephemeral environment tests.
    name: ephemeral-pod-wait-timeout
    type: string
  - default: ""
    description: User ID responsible for the commit
    name: github-user-id
    type: string
  - default: ""
    description: Type of the PR for SQS auto bumping to know which repo to bump
    name: sqs-pr-type
    type: string
  - default: "0"
    description: "The length of time, in seconds, for which to delay a specific message. Valid values: 0 to 900."
    name: sqs-delay-seconds
    type: string
  - name: buildah-format
    default: docker
    type: string
    description: The format for the resulting image's mediaType. Valid values are oci or docker.
  - name: enable-cache-proxy
    default: 'false'
    description: Enable cache proxy configuration
    type: string
  - name: enable-package-registry-proxy
    default: 'true'
    description: Use the package registry proxy when prefetching dependencies
    type: string
  - name: sast-target-dirs
    type: string
    default: .
    description: Target directories to scan with SAST tools. Multiple values should be separated with commas.
  - name: source-date-epoch
    type: string
    default: ''
    description: Sets the image created time and the SOURCE_DATE_EPOCH build argument. On its own, it does not change file timestamps inside the layers (set rewrite-timestamp to "true" for that). Leave empty to keep the actual build time.
  - name: rewrite-timestamp
    type: string
    default: 'false'
    description: When "true", clamp file modification times in the image layers to at most source-date-epoch. Does nothing unless source-date-epoch is set.
  - name: omit-history
    type: string
    default: 'false'
    description: When "true", omit the build history (history timestamps, layer metadata, etc.) from the resulting image.
  results:
  - description: ""
    name: IMAGE_URL
    value: $(tasks.build-image-index.results.IMAGE_URL)
  - description: ""
    name: IMAGE_DIGEST
    value: $(tasks.build-image-index.results.IMAGE_DIGEST)
  - description: ""
    name: CHAINS-GIT_URL
    value: $(tasks.clone-repository.results.url)
  - description: ""
    name: CHAINS-GIT_COMMIT
    value: $(tasks.clone-repository.results.commit)
  tasks:
  - name: init
    params:
    - name: enable-cache-proxy
      value: $(params.enable-cache-proxy)
    taskRef:
      params:
      - name: name
        value: init
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-init:0.4.3@sha256:b8465d543589b1238f6911626657f5766e279a0f33a5f70de68073401e031184
      - name: kind
        value: task
      resolver: bundles
  - name: clone-repository
    params:
    - name: url
      value: $(params.git-url)
    - name: revision
      value: $(params.revision)
          # https://github.com/konflux-ci/build-definitions/tree/main/task/git-clone/0.1
    - name: fetchTags
      value: $(params.fetchTags)
    - name: depth
      value: $(params.cloneDepth)
    runAfter:
    - init
    taskRef:
      params:
      - name: name
        value: git-clone
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-git-clone:0.2.5@sha256:dc8f71a192e51bcdcd9160efcd1c65a091cf37394106b1332c6886c66767deee
      - name: kind
        value: task
      resolver: bundles
    workspaces:
    - name: output
      workspace: workspace
    - name: basic-auth
      workspace: git-auth
  - name: prefetch-dependencies
    params:
    - name: input
      value: $(params.prefetch-input)
    - name: enable-package-registry-proxy
      value: $(params.enable-package-registry-proxy)
    runAfter:
    - clone-repository
    taskRef:
      params:
      - name: name
        value: prefetch-dependencies
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-prefetch-dependencies:0.6.0@sha256:278c47d3bf6d55eaef26453182356a819cb376ba7f55f6e8db01d9e79c98b702
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.prefetch-input)
      operator: notin
      values:
      - ""
    workspaces:
    - name: source
      workspace: workspace
    - name: git-basic-auth
      workspace: git-auth
    - name: netrc
      workspace: netrc
  - name: build-container
    params:
    - name: IMAGE
      value: $(params.output-image)
    - name: DOCKERFILE
      value: $(params.dockerfile)
    - name: CONTEXT
      value: $(params.path-context)
    - name: HERMETIC
      value: $(params.hermetic)
    - name: TARGET_STAGE
      value: $(params.target-stage)
    - name: PREFETCH_INPUT
      value: $(params.prefetch-input)
    - name: IMAGE_EXPIRES_AFTER
      value: $(params.image-expires-after)
    - name: COMMIT_SHA
      value: $(tasks.clone-repository.results.commit)
    - name: BUILD_ARGS
      value:
      - $(params.build-args[*])
    - name: BUILD_ARGS_FILE
      value: $(params.build-args-file)
    - name: ADDITIONAL_SECRET
      value: $(params.additional_secret)
    - name: BUILDAH_FORMAT
      value: $(params.buildah-format)
    - name: SKIP_UNUSED_STAGES
      value: $(params.skip-unused-stages)
    - name: HTTP_PROXY
      value: $(tasks.init.results.http-proxy)
    - name: NO_PROXY
      value: $(tasks.init.results.no-proxy)
    - name: SOURCE_DATE_EPOCH
      value: $(params.source-date-epoch)
    - name: REWRITE_TIMESTAMP
      value: $(params.rewrite-timestamp)
    - name: OMIT_HISTORY
      value: $(params.omit-history)
    runAfter:
    - prefetch-dependencies
    taskRef:
      params:
      - name: name
        value: buildah
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-buildah:0.10.7@sha256:aec102623c7948379d9c13c0223ac6fcbc592fed318ef1e9fa5e2898a88a2943
      - name: kind
        value: task
      resolver: bundles
    workspaces:
    - name: source
      workspace: workspace
  - name: build-image-index
    params:
    - name: IMAGE
      value: $(params.output-image)
    - name: ALWAYS_BUILD_INDEX
      value: $(params.build-image-index)
    - name: IMAGES
      value:
      - $(tasks.build-container.results.IMAGE_URL)@$(tasks.build-container.results.IMAGE_DIGEST)
    - name: BUILDAH_FORMAT
      value: $(params.buildah-format)
    runAfter:
    - build-container
    taskRef:
      params:
      - name: name
        value: build-image-index
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-build-image-index:0.3.1@sha256:a355355b7fcd0ba8de4ba85a162a2e6893f53236b943f79cb03ae0ae9c5ef53c
      - name: kind
        value: task
      resolver: bundles
  - name: build-source-image
    params:
    - name: BINARY_IMAGE
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: BINARY_IMAGE_DIGEST
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: source-build
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-source-build:0.3@sha256:0509d3063d36238c1d94d31625ea517707d52bf0ca6342c8c4571459ba7dba1c
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.build-source-image)
      operator: in
      values:
      - "true"
    workspaces:
    - name: workspace
      workspace: workspace
  - name: deprecated-base-image-check
    params:
    - name: IMAGE_URL
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: IMAGE_DIGEST
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: deprecated-image-check
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-deprecated-image-check:0.5@sha256:0ccc688a77e9b7b0b8973c132a1e840844137e77f887be4a0bec8893b0776872
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
  - name: clair-scan
    params:
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: clair-scan
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-clair-scan:0.3.2@sha256:f5b4415db9ac1fba3e11d993a617e0b275d1f0ed2fc669b12c400ed848c39174
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
  - name: ecosystem-cert-preflight-checks
    params:
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: ecosystem-cert-preflight-checks
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-ecosystem-cert-preflight-checks:0.2@sha256:27c9760ad11c74ad010d9615ee15348e3674843166acb7686929b3ef6840416c
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
  - name: sast-snyk-check
    params:
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: TARGET_DIRS
      value: $(params.sast-target-dirs)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: sast-snyk-check
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-sast-snyk-check:0.5@sha256:73ddc5e7bce4d42f3aac70588c66a30fd9f62a06eea7bb368baac2e2bbaf7d7a
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
    workspaces:
    - name: workspace
      workspace: workspace
  - name: sast-shell-check
    params:
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: TARGET_DIRS
      value: $(params.sast-target-dirs)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: sast-shell-check
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-sast-shell-check:0.1@sha256:330a5b0029e025b2ff32a8892a0b024bfc764bc37e1ec366460113fa1fc00e1d
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
    workspaces:
    - name: workspace
      workspace: workspace
  - name: sast-unicode-check
    params:
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: TARGET_DIRS
      value: $(params.sast-target-dirs)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: sast-unicode-check
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-sast-unicode-check:0.4@sha256:cc79a84f38552a2a87c256fc97872afb13699144ee7efd05e91277b81a992089
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
    workspaces:
    - name: workspace
      workspace: workspace
  - name: clamav-scan
    params:
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: clamav-scan
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-clamav-scan:0.3.1@sha256:53a02326bfb930ca5ef6bfa7a33acca833d57752f34f3cb79255fe2e25e7d217
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
  - name: apply-tags
    params:
    - name: IMAGE_URL
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: IMAGE_DIGEST
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: apply-tags
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-apply-tags:0.3@sha256:6387614ae4f9efa8abb7c4175db0ce5d958bc2b90665b4704880e46fbe0535bf
      - name: kind
        value: task
      resolver: bundles
  - name: push-dockerfile
    params:
    - name: IMAGE
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: IMAGE_DIGEST
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - name: DOCKERFILE
      value: $(params.dockerfile)
    - name: CONTEXT
      value: $(params.path-context)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: push-dockerfile
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-push-dockerfile:0.3.1@sha256:2566bf9f0181b641dd5ef9eb28fb70ee397f90650fce1882dd38bd17792602dd
      - name: kind
        value: task
      resolver: bundles
    workspaces:
    - name: workspace
      workspace: workspace
  - name: rpms-signature-scan
    params:
    - name: image-url
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: image-digest
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    runAfter:
    - build-image-index
    taskRef:
      params:
      - name: name
        value: rpms-signature-scan
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-rpms-signature-scan:0.2.1@sha256:ccb77d1bf7627fc6241a59ed42bb6e5707a8682754fe8ae18f2cfdddbcf29275
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
            ########################
            # Custom Sections
            ########################
    # Lets make source code available in compliant fashion
    # TODO: ideally whole pipeline gets converted to use OCI-TA compliance
  - name: clone-repository-oci-ta
    params:
    - name: url
      value: $(params.git-url)
    - name: revision
      value: $(params.revision)
    - name: ociStorage
      value: $(params.output-image).git
    - name: ociArtifactExpiresAfter
      value: $(params.image-expires-after)
    runAfter:
    - init
    taskRef:
      params:
      - name: name
        value: git-clone-oci-ta
      - name: bundle
        value: quay.io/konflux-ci/tekton-catalog/task-git-clone-oci-ta:0.2.5@sha256:510daad5648d37936b9b2c599a35c8e59b7389de8e1a4e58f6c6d079957d730d
      - name: kind
        value: task
      resolver: bundles
    when:
    - input: "$(params.ephemeral-namespace-run-script)$(params.goss-container-structure-test-file)$(params.sqs-pr-type)"
      operator: notin
      values:
      - ""
    workspaces:
    - name: basic-auth
      workspace: git-auth
    ### Setup ephemeral namespace
  - name: deploy-ephemeral-namespace
    runAfter:
    - clone-repository-oci-ta
    - build-container
    taskRef:
      resolver: git
      params:
      - name: url
        value: https://github.com/konflux-ci/build-definitions.git
      - name: revision
            # Note, we must use a concrete commit ID or enterprise contract will fail
            # The violation log will show you the allowed/trusted commit ref to use
        value: 05686269c33b8f1aac66252c0c7b859b42dca2ed
      - name: pathInRepo
        value: task/eaas-provision-space/0.1/eaas-provision-space.yaml
      - name: shortCommitLength
        value: 7
    params:
    - name: ownerName
      value: $(context.pipelineRun.name)
    - name: ownerUid
      value: $(context.pipelineRun.uid)
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
    - input: "$(params.ephemeral-namespace-run-script)$(params.goss-container-structure-test-file)"
      operator: notin
      values:
      - ""
    ### Container Structure Test
    # For task compliance follow https://konflux.pages.redhat.com/docs/users/building/using-trusted-artifacts.html#migrate-to-trusted-artifacts
  - name: container-structure-test
    runAfter:
    - deploy-ephemeral-namespace
    - build-image-index
    params:
    - name: SOURCE_ARTIFACT
      value: $(tasks.clone-repository-oci-ta.results.SOURCE_ARTIFACT)
    - name: SCRIPT_PATH
      value: $(params.goss-container-structure-test-file)
    - name: IMAGE_URL
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: POD_WAIT_TIMEOUT
      value: $(params.ephemeral-pod-wait-timeout)
    taskSpec:
      params:
      - description: The Trusted Artifact URI pointing to the artifact with the application source code.
        name: SOURCE_ARTIFACT
        type: string
      stepTemplate:
        volumeMounts:
        - mountPath: /var/workdir
          name: workdir
      volumes:
          # New volume to store a copy of the source code accessible only to this Task.
      - name: workdir
        emptyDir: {}
      steps:
          # New step to fetch the Trusted Artifact and make it available to the next steps.
      - name: use-trusted-artifact
        image: quay.io/redhat-appstudio/build-trusted-artifacts:latest@sha256:9b180776a41d9a22a1c51539f1647c60defbbd55b44bbebdd4130e33512d8b0d
        args:
        - use
        - $(params.SOURCE_ARTIFACT)=/var/workdir/source
      - name: run-script
        image: registry.redhat.io/openshift4/ose-cli:$(params.ephemeral-namespace-oc-cli-version)
        workingDir: /var/workdir/source
        env:
        - name: KUBECONFIG_VALUE
          valueFrom:
            secretKeyRef:
              name: "$(tasks.deploy-ephemeral-namespace.results.secretRef)"
              key: kubeconfig
        - name: SCRIPT_PATH
          value: $(params.goss-container-structure-test-file)
        - name: IMAGE_URL
          value: $(tasks.build-image-index.results.IMAGE_URL)
        - name: POD_WAIT_TIMEOUT
          value: $(params.ephemeral-pod-wait-timeout)
        script: |
          #!/usr/bin/env bash
          set -euo pipefail

          # Lets ensure a unique job name - just to be safe
          JOB_NAME="goss-test-$(uuidgen)"

          # Expose KUBECONFIG for test namespace
          echo "$KUBECONFIG_VALUE" > /tmp/cfg
          export KUBECONFIG=/tmp/cfg

          # Cleanup function to ensure resources are deleted
          cleanup() {
            echo "Cleanup"
            oc delete job ${JOB_NAME} 2>/dev/null || true
            oc delete configmap ${JOB_NAME} 2>/dev/null || true
          }
          trap cleanup EXIT

          # Create ConfigMap with goss test file
          echo "Creating ConfigMap with goss test configuration"
          oc create configmap ${JOB_NAME} --from-file=goss.yaml=${SCRIPT_PATH}

          # Create job definition at /tmp/job.yaml
          cat > /tmp/job.yaml <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB_NAME}
            labels:
              app: ${JOB_NAME}
              env: ci
          spec:
            backoffLimit: 0
            template:
              metadata:
                labels:
                  app: ${JOB_NAME}
              spec:
                restartPolicy: Never
                initContainers:
                - name: copy-goss
                  image: ghcr.io/goss-org/goss:v0.4.9
                  command: ["/bin/sh", "-c"]
                  args:
                  - |
                    cp /usr/bin/goss /goss/bin/goss
                    chmod +x /goss/bin/goss
                  volumeMounts:
                  - name: goss-bin
                    mountPath: /goss/bin
                containers:
                - name: app
                  image: ${IMAGE_URL}
                  command: ["/goss/bin/goss"]
                  args: ["--gossfile", "/goss/config/goss.yaml", "validate"]
                  volumeMounts:
                  - name: goss-bin
                    mountPath: /goss/bin
                  - name: goss-config
                    mountPath: /goss/config
                volumes:
                - name: goss-bin
                  emptyDir: {}
                - name: goss-config
                  configMap:
                    name: ${JOB_NAME}
          EOF

          echo "Deploy goss test job for ${IMAGE_URL}"
          oc apply -f /tmp/job.yaml

          echo "Wait for job to complete"
          oc wait --for=condition=Complete job/${JOB_NAME} --timeout=${POD_WAIT_TIMEOUT} || true

          echo "Job logs:"
          oc logs job/${JOB_NAME}

          # Check if job succeeded
          JOB_STATUS=$(oc get job ${JOB_NAME} -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}')
          if [ "$JOB_STATUS" != "True" ]; then
            echo "Job failed!"
            exit 1
          fi
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
    - input: $(params.goss-container-structure-test-file)
      operator: notin
      values:
      - ""
    ### Custom script run in ephemeral namespace
    # For task compliance follow https://konflux.pages.redhat.com/docs/users/building/using-trusted-artifacts.html#migrate-to-trusted-artifacts
  - name: run-custom-script-in-ephemeral-namespace
    runAfter:
    - container-structure-test
    - build-image-index
    params:
    - name: SOURCE_ARTIFACT
      value: $(tasks.clone-repository-oci-ta.results.SOURCE_ARTIFACT)
    - name: SCRIPT_PATH
      value: $(params.ephemeral-namespace-run-script)
    - name: IMAGE_URL
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - name: IMAGE_DIGEST
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    taskSpec:
      params:
      - description: The Trusted Artifact URI pointing to the artifact with the application source code.
        name: SOURCE_ARTIFACT
        type: string
      stepTemplate:
        volumeMounts:
        - mountPath: /var/workdir
          name: workdir
      volumes:
          # New volume to store a copy of the source code accessible only to this Task.
      - name: workdir
        emptyDir: {}
      steps:
          # New step to fetch the Trusted Artifact and make it available to the next steps.
      - name: use-trusted-artifact
        image: quay.io/redhat-appstudio/build-trusted-artifacts:latest@sha256:9b180776a41d9a22a1c51539f1647c60defbbd55b44bbebdd4130e33512d8b0d
        args:
        - use
        - $(params.SOURCE_ARTIFACT)=/var/workdir/source
      - name: run-script
        image: registry.redhat.io/openshift4/ose-cli:$(params.ephemeral-namespace-oc-cli-version)
        workingDir: /var/workdir/source
        env:
        - name: KUBECONFIG_VALUE
          valueFrom:
            secretKeyRef:
              name: "$(tasks.deploy-ephemeral-namespace.results.secretRef)"
              key: kubeconfig
        - name: SCRIPT_PATH
          value: $(params.ephemeral-namespace-run-script)
        - name: IMAGE_URL
          value: $(tasks.build-image-index.results.IMAGE_URL)
        - name: IMAGE_DIGEST
          value: $(tasks.build-image-index.results.IMAGE_DIGEST)
        script: |
          #!/usr/bin/env bash
          set -euo pipefail

          # Expose KUBECONFIG for test namespace
          echo "$KUBECONFIG_VALUE" > /tmp/cfg
          export KUBECONFIG=/tmp/cfg

          echo "Running script ${SCRIPT_PATH}"
          chmod +x ./${SCRIPT_PATH}
          ./${SCRIPT_PATH}
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
    - input: $(params.ephemeral-namespace-run-script)
      operator: notin
      values:
      - ""
    # send SQS message for auto bump MRs
  - name: send-sqs-message
    params:
    - name: sqs-pr-type
      value: $(params.sqs-pr-type)
    - name: skip-checks
      value: $(params.skip-checks)
    - name: github-user-id
      value: $(params.github-user-id)
    runAfter:
    - clamav-scan
    - push-dockerfile
    - clair-scan
    - rpms-signature-scan
    - run-custom-script-in-ephemeral-namespace
    - ecosystem-cert-preflight-checks
    - apply-tags
    - sast-shell-check
    - deprecated-base-image-check
    - sast-unicode-check
    - build-source-image
    - sast-snyk-check
    taskSpec:
      steps:
      - name: run-script
            # TODO: do we have sth from redhat here?
        image: public.ecr.aws/aws-cli/aws-cli:2.36.8@sha256:7e1b11a3c93bc5af81f496de0662f666b2352a4a6666e8ebae904fe102b131b6
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: app-sre-app-interface-sqs-credentials
              key: aws_access_key_id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: app-sre-app-interface-sqs-credentials
              key: aws_secret_access_key
        - name: AWS_REGION
          valueFrom:
            secretKeyRef:
              name: app-sre-app-interface-sqs-credentials
              key: aws_region
        - name: SQS_QUEUE_URL
          valueFrom:
            secretKeyRef:
              name: app-sre-app-interface-sqs-credentials
              key: sqs_url
        - name: GITHUB_USER_ID
          value: $(params.github-user-id)
        - name: PR_TYPE
          value: $(params.sqs-pr-type)
        - name: DELAY_SECONDS
          value: $(params.sqs-delay-seconds)
        - name: COMMIT
          value: $(tasks.clone-repository-oci-ta.results.commit)
        - name: SHORT_COMMIT
          value: $(tasks.clone-repository-oci-ta.results.short-commit)
        script: |
          #!/usr/bin/env bash
          echo "GITHUB_USER_ID: ${GITHUB_USER_ID}"
          echo "COMMIT: ${COMMIT}"
          echo "SHORT_COMMIT: ${SHORT_COMMIT}"
          echo "AWS_REGION: ${AWS_REGION}"
          echo "SQS_QUEUE_URL: ${SQS_QUEUE_URL}"
          echo "PR_TYPE: ${PR_TYPE}"
          echo "DELAY_SECONDS: ${DELAY_SECONDS}"
          aws sqs send-message --queue-url ${SQS_QUEUE_URL} --delay-seconds ${DELAY_SECONDS} --message-body "{\"pr_type\": \"${PR_TYPE}\", \"version\": \"${SHORT_COMMIT}\", \"commit_sha\": \"${COMMIT}\", \"github_user_id\": \"${GITHUB_USER_ID}\"}"
    when:
    - input: $(params.skip-checks)
      operator: in
      values:
      - "false"
    - input: $(params.sqs-pr-type)
      operator: notin
      values:
      - ""
